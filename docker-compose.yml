services:
  keeport:
    build: .
    image: keeport:latest
    container_name: keeport
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080;http://+:8081
      KeePort__DataDir: /data
      KeePort__CookieSecure: ${KEEPORT_COOKIE_SECURE:-false}
      KeePort__AdminPorts__0: ${KEEPORT_ADMIN_PORT:-8081}
    ports:
      - "8080:8080"
      - "${KEEPORT_ADMIN_BIND:-127.0.0.1}:${KEEPORT_ADMIN_HOST_PORT:-8081}:8081"
    volumes:
      - keeport-data:/data

volumes:
  keeport-data:
