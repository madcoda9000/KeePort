services:
  keeport:
    build: .
    image: keeport:latest
    container_name: keeport
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080;http://+:8081
      KeePort__DataDir: /data
      KeePort__CookieSecure: ${KEEPORT_COOKIE_SECURE:-false}
      # The container always serves the admin console on 8081; change KEEPORT_ADMIN_HOST_PORT to move it on the host.
      KeePort__AdminPorts__0: "8081"
      KeePort__TrustedProxies: ${KEEPORT_TRUSTED_PROXIES:-}
      # HTTPS with a self-signed certificate on the admin port; set KEEPORT_ADMIN_HTTPS=false to keep plain HTTP.
      KeePort__AdminHttps: ${KEEPORT_ADMIN_HTTPS:-true}
      KeePort__AdminTlsHosts: ${KEEPORT_ADMIN_TLS_HOSTS:-}
      # Lets users store a website's icon in a vault entry; KeePort then fetches it from the public site once.
      KeePort__FaviconDownload: ${KEEPORT_FAVICON_DOWNLOAD:-true}
      # Passkeys: normally the domain the page is opened with; set these only if that does not work behind your proxy.
      KeePort__PasskeyRpId: ${KEEPORT_PASSKEY_RP_ID:-}
      KeePort__PasskeyOrigins: ${KEEPORT_PASSKEY_ORIGINS:-}
    ports:
      - "${KEEPORT_HTTP_HOST_PORT:-8080}:8080"
      - "${KEEPORT_ADMIN_BIND:-0.0.0.0}:${KEEPORT_ADMIN_HOST_PORT:-8081}:8081"
    volumes:
      # A named volume by default; set KEEPORT_DATA to a folder (e.g. ./data) to use a bind mount.
      - ${KEEPORT_DATA:-keeport-data}:/data

volumes:
  keeport-data:
